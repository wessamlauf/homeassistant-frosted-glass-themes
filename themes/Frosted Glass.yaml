  # =========================
  # CARD-MOD (top level)
  # =========================
  card-mod-theme: "Frosted Glass Glass"
  card-mod-card: |
    ha-card {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      position: relative;
    }
    ha-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--ha-card-glass-tint);
      backdrop-filter: var(--ha-card-backdrop-filter);
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      box-shadow: var(--ha-card-glass-inset-shadow);
    }
    :host(hui-heading-card) ha-card,
    :host(hui-glance-card) ha-card {
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    :host(hui-heading-card) ha-card::before,
    :host(hui-glance-card) ha-card::before {
      content: none !important;
    }
    .mdc-data-table {
      background: none !important;
    }
    .mdc-data-table__header-cell {
      background: var(--data-table-header-bg) !important;
      backdrop-filter: var(--ha-card-backdrop-filter) !important;
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter) !important;
      box-shadow: var(--ha-card-glass-inset-shadow) !important;
    }
    :host(.text-only) ha-card,
    :host(.text-only) ha-card::before,
    ha-card.text-only,
    ha-card.text-only::before {
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      content: none !important;
    }
    :host(mushroom-title-card) ha-card {
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
    }
    :host(mushroom-title-card) ha-card::before {
      content: none !important;
    }
    :host(.type-custom-bubble-card) ha-card {
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
      border-radius: 0px !important;
    }
    :host(.type-custom-bubble-card) ha-card::before {
      content: none !important;
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    :host(mushroom-chips-card) ha-card {
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
    }
    :host(mushroom-chips-card) ha-card::before {
      content: none !important;
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
  card-mod-root: |
    .mdc-drawer .mdc-drawer__content {
      backdrop-filter: var(--ha-card-backdrop-filter) !important;
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter) !important;
      background: var(--sidebar-background-color) !important;
      box-shadow: var(--ha-card-glass-inset-shadow) !important;
    }
    ha-card {
      position: relative;
      border-radius: var(--ha-card-border-radius);
      border: var(--ha-card-border-width) solid var(--ha-card-border-color);
      box-shadow: var(--ha-card-box-shadow);
    }
    ha-card ha-card {
      --ha-card-border-width: 0px;
    }
    ha-drawer {
      --mdc-drawer-scrim-color: var(--mdc-dialog-scrim-color) !important;
    }
    ha-label-badge {
      --label-badge-background-color: var(--label-badge-bg-glass) !important;
      backdrop-filter: var(--ha-card-backdrop-filter) !important;
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter) !important;
      --label-badge-text-color: var(--label-badge-text-color) !important;
      box-shadow: var(--badge-box-shadow) !important;
      border: 0.5px solid var(--ha-card-border-color) !important;
    }
    input, ha-textfield, ha-select {
      background: var(--input-glass-background) !important;
      backdrop-filter: var(--ha-card-backdrop-filter) !important;
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter) !important;
      border-radius: var(--token-size-radius-small);
      border: none !important;
      box-shadow: var(--input-glass-shadow) !important;
    }
    custom-text-divider-row .text-divider-content {
      background: var(--text-divider-bg) !important;
      opacity: 1 !important;
      box-shadow: none !important;
      border-radius: 10px !important;
      padding: 0 8px !important;
      --text-divider-font-size: 16px !important;
      --text-divider-line-size: 1px;
      --text-divider-color: var(--primary-text-color) !important;
    }
