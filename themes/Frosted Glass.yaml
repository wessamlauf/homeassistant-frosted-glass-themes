      label-badge-bg-glass: 'rgba(60, 60, 78, 0.28)'
      badge-box-shadow: '0 5px 10px rgba(0, 0, 0, 0.10)'
      input-glass-background: 'rgba(30, 33, 54, 0.7)'
      input-glass-shadow: 'inset 0 1px 3px rgba(0, 0, 0, 0.09)'
