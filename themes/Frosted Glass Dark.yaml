# Frosted Glass Dark
# ver. 1.5.0 - (2026-09-30)

Frosted Glass Dark:
  card-mod-theme: 'Frosted Glass Dark'
  uix-theme: 'Frosted Glass Dark'

  # =========================
  # HEADER (Top Bar)
  # =========================
  app-header-backdrop-filter: 'blur(8px) saturate(1.1)'
  app-header-background-color: 'rgba(25, 28, 45, 0.72)'
  app-header-text-color: 'rgba(240, 243, 255, 0.95)'
  app-header-edit-background-color: 'rgb(25, 28, 45)'
  app-header-edit-text-color: 'rgba(234, 235, 238, 0.98)'
  app-theme-color: 'rgb(0, 0, 0)'                                                      # 1.2 Glass – header theme color hint for browsers

  # =========================
  # SIDEBAR / DRAWER
  # =========================
  sidebar-background-color: 'rgba(25, 28, 45, 0.72)'
  sidebar-backdrop-filter: 'blur(20px) saturate(1.3)'
  sidebar-border-color: 'rgba(255, 255, 255, 0.12)'
  sidebar-icon-color: 'rgba(234, 235, 238, 0.6)'
  sidebar-text-color: 'rgba(234, 235, 238, 0.8)'
  sidebar-selected-icon-color: 'rgba(234, 235, 238, 0.95)'
  sidebar-selected-text-color: 'rgba(234, 235, 238, 0.98)'

  # =========================
  # DIALOGS
  # =========================
  # Keep this surface unfiltered so legacy fixed-position menus retain the viewport.
  ha-dialog-surface-backdrop-filter: 'none'
  ha-dialog-surface-background: 'rgb(25, 28, 45)'
  dialog-box-shadow: '0 24px 64px rgba(0, 0, 0, 0.48), 0 4px 18px rgba(0, 0, 0, 0.28)'
  paper-dialog-background-color: 'rgb(25, 28, 45)'
  mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.8)'

  # =========================
  # THIRD-PARTY CARD CONTRACTS
  # =========================
  # Bubble Card: official global theme variables.
  bubble-border-radius: '18px'
  bubble-main-background-color: 'transparent'
  bubble-secondary-background-color: 'rgba(255, 255, 255, 0.09)'
  bubble-accent-color: 'rgb(106, 116, 211)'
  bubble-icon-border-radius: '14px'
  bubble-icon-background-color: 'rgba(255, 255, 255, 0.11)'
  bubble-sub-button-border-radius: '12px'
  bubble-sub-button-background-color: 'rgba(255, 255, 255, 0.10)'
  bubble-box-shadow: 'var(--ha-card-box-shadow)'
  bubble-border: '0.5px solid rgba(255, 255, 255, 0.12)'
  bubble-pop-up-border-radius: '28px'
  bubble-pop-up-main-background-color: 'rgb(25, 28, 45)'
  bubble-pop-up-background-color: 'rgb(25, 28, 45)'
  bubble-backdrop-background-color: 'rgba(0, 0, 0, 0.58)'
  bubble-select-list-border-radius: '14px'
  bubble-select-list-background-color: 'var(--frosted-glass-menu-surface)'
  bubble-select-list-item-accent-color: 'rgba(106, 116, 211, 0.24)'
  bubble-horizontal-buttons-stack-border-radius: '18px'
  bubble-horizontal-buttons-stack-background-color: 'transparent'

  # Navbar Card: official variables plus a theme-owned filter consumed below.
  navbar-background-color: 'transparent'
  navbar-primary-color: 'rgb(106, 116, 211)'
  navbar-border-radius: '18px'
  navbar-box-shadow: 'var(--ha-card-box-shadow), var(--ha-card-glass-inset-shadow)'
  navbar-box-shadow-desktop: 'var(--ha-card-box-shadow), var(--ha-card-glass-inset-shadow)'
  navbar-box-shadow-mobile-floating: 'var(--ha-card-box-shadow), var(--ha-card-glass-inset-shadow)'
  navbar-backdrop-filter: 'blur(20px) saturate(1.3)'

  # Simple Swipe Card and Slider Button Card public variables.
  simple-swipe-card-pagination-background: 'transparent'
  simple-swipe-card-pagination-dot-inactive-color: 'rgba(234, 235, 238, 0.34)'
  simple-swipe-card-pagination-dot-active-color: 'rgb(106, 116, 211)'
  simple-swipe-card-pagination-dot-active-box-shadow: '0 0 12px rgba(106, 116, 211, 0.34)'
  btn-bg-color-off: 'rgba(255, 255, 255, 0.08)'
  btn-bg-color-on: 'rgba(106, 116, 211, 0.22)'
  slider-track-color: 'rgba(234, 235, 238, 0.16)'

  # =========================
  # CARDS / CARD-MOD
  # =========================
  card-mod-card-yaml: |
    .: |
      {% set entity = config.entity if config is defined and config.entity is defined and config.entity is string else '' %}
      {% set light_on = entity.startswith('light.') and is_state(entity, 'on') %}
      {% set fan_on = entity.startswith('fan.') and is_state(entity, 'on') %}
      :host {
        --frosted-glass-entity-light-glow: {{ 'var(--frosted-glass-light-glow)' if light_on else '0 0 0 0 transparent' }};
        --frosted-glass-entity-light-border: {{ 'var(--frosted-glass-light-border-color)' if light_on else 'var(--ha-card-border-color)' }};
        --frosted-glass-entity-light-filter: {{ 'drop-shadow(var(--frosted-glass-light-icon-glow))' if light_on else 'none' }};
      }

      /* Keep fixed-position menus in the viewport coordinate system. */
      ha-card {
        background: transparent !important;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        position: relative;
        isolation: isolate;
        border-color: var(--frosted-glass-entity-light-border, var(--ha-card-border-color));
        box-shadow: var(--ha-card-box-shadow), var(--frosted-glass-entity-light-glow, 0 0 0 0 transparent);
        transition: box-shadow 220ms ease, border-color 220ms ease;
      }

      /* Low specificity lets per-card artwork override the glass layer. */
      :where(:host(:not(mushroom-template-card):not(room-summary-card))) ha-card::before {
        content: var(--frosted-glass-card-layer-content, '');
        position: absolute;
        inset: 0;
        background: var(--ha-card-glass-tint);
        backdrop-filter: var(--ha-card-backdrop-filter);
        -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
        z-index: -1;
        pointer-events: none;
        border-radius: inherit;
        box-shadow: var(--ha-card-glass-inset-shadow);
      }

      /* Containers and text-only cards leave their content's surface intact. */
      :host(hui-heading-card) ha-card,
      :host(.text-only) ha-card,
      ha-card.text-only,
      :host(mushroom-title-card) ha-card,
      :host(mushroom-chips-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        box-shadow: none !important;
        border: none !important;
      }
      :host(hui-heading-card) ha-card::before,
      :host(.text-only) ha-card::before,
      ha-card.text-only::before,
      :host(mushroom-title-card) ha-card::before,
      :host(mushroom-chips-card) ha-card::before {
        content: none !important;
      }

      /* Bubble owns its rounded surface. Its blur layer cannot trap fixed menus. */
      :host(bubble-card) ha-card,
      :host(.type-custom-bubble-card) ha-card,
      ha-card:has(.bubble-container) {
        background: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
      }
      :host(bubble-card) ha-card::before,
      :host(.type-custom-bubble-card) ha-card::before,
      ha-card:has(.bubble-container)::before {
        content: none !important;
      }
      .bubble-container {
        background: transparent !important;
        border-color: var(--frosted-glass-entity-light-border, var(--ha-card-border-color));
        box-shadow: var(--bubble-box-shadow), var(--frosted-glass-entity-light-glow, 0 0 0 0 transparent);
      }
      .bubble-background {
        background: transparent !important;
        transition: none;
      }
      .bubble-container::before {
        box-shadow: var(--ha-card-glass-inset-shadow);
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        backdrop-filter: var(--ha-card-backdrop-filter);
        -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
      }

      /* Transparent Hue surfaces need the theme's matching foreground. */
      :host(hue-like-light-card) ha-card,
      :host(.type-custom-hue-like-light-card) ha-card {
        --hue-text-color: var(--primary-text-color);
        color: var(--primary-text-color) !important;
      }

      /* These cards declare defaults on :host, so inherited public variables alone
         cannot override them. Aliases preserve the selected theme's values. */
      :host(:where(navbar-card, .type-custom-navbar-card)) {
        --navbar-background-color: var(--frosted-glass-navbar-background);
        --navbar-primary-color: var(--frosted-glass-navbar-primary);
        --navbar-border-radius: var(--frosted-glass-navbar-radius);
        --navbar-box-shadow: var(--frosted-glass-navbar-shadow);
        --navbar-box-shadow-desktop: var(--frosted-glass-navbar-shadow-desktop);
        --navbar-box-shadow-mobile-floating: var(--frosted-glass-navbar-shadow-floating);
      }
      :host(navbar-card) ha-card,
      :host(.type-custom-navbar-card) ha-card {
        --frosted-glass-card-layer-content: none;
        background: var(--navbar-background-color) !important;
        backdrop-filter: var(--navbar-backdrop-filter);
        -webkit-backdrop-filter: var(--navbar-backdrop-filter);
        border: var(--ha-card-border);
      }
      :host(navbar-card) .popup-item .button {
        backdrop-filter: var(--navbar-backdrop-filter);
        -webkit-backdrop-filter: var(--navbar-backdrop-filter);
        border: var(--ha-card-border);
      }

      :host(:where(slider-button-card, .type-custom-slider-button-card)) {
        --btn-bg-color-off: var(--frosted-glass-slider-button-off);
        --btn-bg-color-on: var(--frosted-glass-slider-button-on);
        --slider-track-color: var(--frosted-glass-slider-track);
      }

      /* Leave both pseudo-elements available for Mushroom template artwork. */
      :host(mushroom-template-card) ha-card {
        background: transparent !important;
        box-shadow: var(--ha-card-box-shadow), var(--ha-card-glass-inset-shadow), var(--frosted-glass-entity-light-glow, 0 0 0 0 transparent);
        backdrop-filter: var(--ha-card-backdrop-filter);
        -webkit-backdrop-filter: var(--ha-card-backdrop-filter);
      }

      /* stack-in-card writes this inline only when keep.background is false and
         --keep-background is not true. Honor that decision instead of hiding every
         descendant, including those whose background was explicitly kept. */
      ha-card[style*="background: transparent"] {
        --ha-card-backdrop-filter: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border: none;
      }
      ha-card[style*="background: transparent"]::before {
        content: none !important;
      }

      .mdc-data-table {
        background: none !important;
      }
      .mdc-data-table__header-cell {
        background: var(--frosted-glass-control-surface);
      }

      /* Active-state feedback uses attributes exposed by HA, or Bubble's icon/state
         classes. It never infers an entity's state from a displayed color. */
      ha-card:has(ha-state-icon[data-domain="light"][data-state="on"]),
      ha-card:has(ha-tile-icon[data-domain="light"][data-state="on"]),
      ha-card:has(.light-button.state-on) {
        border-color: var(--frosted-glass-light-border-color);
        box-shadow: var(--ha-card-box-shadow), var(--frosted-glass-light-glow);
      }
      ha-card.is-on .bubble-container:has(.bubble-main-icon[icon^="mdi:lightbulb"]) {
        border-color: var(--frosted-glass-light-border-color);
        box-shadow: var(--bubble-box-shadow), var(--frosted-glass-light-glow);
      }
      ha-state-icon[data-domain="light"][data-state="on"],
      ha-tile-icon[data-domain="light"][data-state="on"] ha-state-icon,
      .light-button.state-on ha-state-icon {
        filter: drop-shadow(var(--frosted-glass-light-icon-glow));
      }

      @keyframes frosted-glass-fan-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      ha-state-icon[data-domain="fan"][data-state="on"],
      ha-tile-icon[data-domain="fan"][data-state="on"] ha-state-icon,
      ha-card.is-on .bubble-main-icon:is([icon="mdi:fan"], [icon^="mdi:fan-speed-"]) {
        animation: frosted-glass-fan-spin 4s linear infinite;
        transform-origin: center;
      }

      /* HA's template subscription tracks config.entity. Mushroom does not
         expose that state as an attribute outside its shape shadow root. */
      :host(mushroom-fan-card) mushroom-shape-icon ha-state-icon {
        animation: {{ 'frosted-glass-fan-spin 4s linear infinite' if fan_on else 'none' }};
        transform-origin: center;
      }
      :host(mushroom-light-card) mushroom-shape-icon ha-state-icon {
        filter: var(--frosted-glass-entity-light-filter, none);
      }

      @media (prefers-reduced-motion: reduce) {
        ha-card {
          transition: none;
        }
        ha-state-icon,
        .bubble-main-icon {
          animation: none !important;
        }
      }

  # Global glass tokens are inherited by dialogs, sidebar and custom cards.
  ha-card-backdrop-filter: 'blur(10px) saturate(1.25) contrast(var(--frosted-glass-contrast, 1))'
  ha-card-glass-tint: 'transparent'
  ha-card-glass-inset-shadow: '3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.15) inset, -2px -2px 0.5px -2px rgba(255, 255, 255, 0.1) inset, 0 0 8px 1px rgba(255, 255, 255, 0.06) inset, 0 0 2px 0 rgba(0, 0, 0, 0.18)'
  frosted-glass-menu-surface: 'rgb(25, 28, 45)'
  frosted-glass-control-surface: 'rgba(25, 28, 45, 0.32)'
  frosted-glass-badge-shadow: '0 3px 10px rgba(0, 0, 0, 0.22)'
  frosted-glass-light-border-color: 'rgba(255, 211, 96, 0.30)'
  frosted-glass-light-glow: '0 0 24px rgba(255, 202, 74, 0.18)'
  frosted-glass-light-icon-glow: '0 0 8px rgba(255, 211, 96, 0.42)'
  frosted-glass-navbar-background: 'var(--navbar-background-color)'
  frosted-glass-navbar-primary: 'var(--navbar-primary-color)'
  frosted-glass-navbar-radius: 'var(--navbar-border-radius)'
  frosted-glass-navbar-shadow: 'var(--navbar-box-shadow)'
  frosted-glass-navbar-shadow-desktop: 'var(--navbar-box-shadow-desktop)'
  frosted-glass-navbar-shadow-floating: 'var(--navbar-box-shadow-mobile-floating)'
  frosted-glass-slider-button-off: 'var(--btn-bg-color-off)'
  frosted-glass-slider-button-on: 'var(--btn-bg-color-on)'
  frosted-glass-slider-track: 'var(--slider-track-color)'

  card-mod-badge: |
    ha-badge,
    .badge {
      --ha-card-box-shadow: var(--frosted-glass-badge-shadow);
    }
    ha-badge {
      backdrop-filter: var(--ha-card-backdrop-filter, none);
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter, none);
    }

  card-mod-more-info-yaml: |
    $:
      .: |
        /* Only the modern dialog has this sibling backdrop. Legacy MWC dialogs
           filter their ancestor instead, so they keep the opaque fallback. */
        wa-dialog {
          --ha-dialog-surface-background: var(--frosted-glass-popup-surface);
          --ha-dialog-scrim-backdrop-filter: var(--frosted-glass-popup-backdrop-filter);
          --mdc-dialog-scrim-color: var(--frosted-glass-popup-scrim);
        }
      ha-dialog $: |
        wa-dialog {
          --ha-dialog-surface-background: var(--frosted-glass-popup-surface);
          --ha-dialog-scrim-backdrop-filter: var(--frosted-glass-popup-backdrop-filter);
          --mdc-dialog-scrim-color: var(--frosted-glass-popup-scrim);
        }
      ha-bottom-sheet $: |
        wa-drawer {
          --ha-bottom-sheet-surface-background: var(--frosted-glass-popup-surface);
          --ha-bottom-sheet-scrim-backdrop-filter: var(--frosted-glass-popup-backdrop-filter);
          --ha-bottom-sheet-scrim-color: var(--frosted-glass-popup-scrim);
        }

  card-mod-dialog-yaml: |
    $:
      .: |
        /* Only the modern dialog has this sibling backdrop. Legacy MWC dialogs
           filter their ancestor instead, so they keep the opaque fallback. */
        wa-dialog {
          --ha-dialog-surface-background: var(--frosted-glass-popup-surface);
          --ha-dialog-scrim-backdrop-filter: var(--frosted-glass-popup-backdrop-filter);
          --mdc-dialog-scrim-color: var(--frosted-glass-popup-scrim);
        }
      ha-dialog $: |
        wa-dialog {
          --ha-dialog-surface-background: var(--frosted-glass-popup-surface);
          --ha-dialog-scrim-backdrop-filter: var(--frosted-glass-popup-backdrop-filter);
          --mdc-dialog-scrim-color: var(--frosted-glass-popup-scrim);
        }
      ha-bottom-sheet $: |
        wa-drawer {
          --ha-bottom-sheet-surface-background: var(--frosted-glass-popup-surface);
          --ha-bottom-sheet-scrim-backdrop-filter: var(--frosted-glass-popup-backdrop-filter);
          --ha-bottom-sheet-scrim-color: var(--frosted-glass-popup-scrim);
        }

  card-mod-sidebar: |
    :host {
      position: relative;
      isolation: isolate;
      background: transparent;
    }
    :host::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: var(--sidebar-background-color);
      backdrop-filter: var(--sidebar-backdrop-filter, none);
      -webkit-backdrop-filter: var(--sidebar-backdrop-filter, none);
      box-shadow: inset -1px 0 0 var(--sidebar-border-color);
    }
    .menu {
      background: transparent;
    }

  card-mod-drawer: |
    /* Put the same wallpaper behind the sidebar's glass, including on
       configuration panels. A pseudo-element on the sidebar owns its blur. */
    .sidebar-shell,
    .mdc-drawer {
      background: var(--lovelace-background, var(--background-image));
      border-inline-end: 0.5px solid var(--sidebar-border-color);
    }
    .mdc-drawer__content {
      background: transparent;
    }
    wa-drawer::part(dialog) {
      background: var(--lovelace-background, var(--background-image));
      border-inline-end: 0.5px solid var(--sidebar-border-color);
    }
    :host {
      --mdc-drawer-scrim-color: var(--mdc-dialog-scrim-color);
    }

  card-mod-row-yaml: |
    hui-generic-entity-row $:
      state-badge $: |
        @keyframes frosted-glass-fan-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        ha-state-icon[data-domain="fan"][data-state="on"] {
          animation: frosted-glass-fan-spin 4s linear infinite;
          transform-origin: center;
        }
        @media (prefers-reduced-motion: reduce) {
          ha-state-icon { animation: none !important; }
        }
    state-badge $: |
      @keyframes frosted-glass-fan-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      ha-state-icon[data-domain="fan"][data-state="on"] {
        animation: frosted-glass-fan-spin 4s linear infinite;
        transform-origin: center;
      }
      @media (prefers-reduced-motion: reduce) {
        ha-state-icon { animation: none !important; }
      }

  card-mod-glance-yaml: |
    state-badge $: |
      @keyframes frosted-glass-fan-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      ha-state-icon[data-domain="fan"][data-state="on"] {
        animation: frosted-glass-fan-spin 4s linear infinite;
        transform-origin: center;
      }
      @media (prefers-reduced-motion: reduce) {
        ha-state-icon { animation: none !important; }
      }

  # =========================
  # CARD-MOD-ROOT GLOBAL CSS
  # =========================
  card-mod-root: |
    :host {

      /* Glass system tokens (new, dark-tuned) */

      /* Tokens - match structure to Light theme for consistency */
      --token-rgb-primary: 106, 116, 211;
      --token-rgb-black: 0, 0, 0;
      --token-rgb-white: 234, 235, 238;
      --token-rgb-purple: 129, 45, 250;
      --token-rgb-pink: 204, 0, 136;
      --token-rgb-red: 204, 0, 51;
      --token-rgb-deep-purple: 98, 0, 234;
      --token-rgb-indigo: 48, 63, 159;
      --token-rgb-blue: 33, 150, 243;
      --token-rgb-light-blue: 3, 169, 244;
      --token-rgb-cyan: 106, 116, 211;
      --token-rgb-teal: 106, 116, 211;
      --token-rgb-green: 56, 142, 60;
      --token-rgb-light-green: 139, 195, 74;
      --token-rgb-lime: 205, 220, 57;
      --token-rgb-yellow: 250, 183, 0;
      --token-rgb-amber: 255, 193, 7;
      --token-rgb-orange: 255, 158, 0;
      --token-rgb-deep-orange: 255, 87, 34;
      --token-rgb-brown: 121, 85, 72;
      --token-rgb-grey: 103, 104, 119;
      --token-rgb-blue-grey: 96, 125, 139;
      --token-rgb-disabled: 189, 189, 189;
      --token-rgb-state-inactive: 176, 190, 197;

      --token-color-primary: rgb(var(--token-rgb-primary));
      --token-color-primary-light: rgb(167 182 199);
      --token-color-accent: rgb(var(--token-rgb-teal));
      --token-color-disabled: rgb(173 176 184);
      --token-color-feedback-info: rgb(106, 116, 211);
      --token-color-feedback-warning: rgb(255, 219, 117);
      --token-color-feedback-error: rgb(234, 114, 135);
      --token-color-feedback-success: rgb(118, 214, 152);
      --token-color-icon-primary: rgba(234, 235, 238, 0.95);
      --token-color-icon-secondary: rgba(234, 235, 238, 0.75);
      --token-color-icon-sidebar: rgba(234, 235, 238, 0.6);
      --token-color-icon-sidebar-selected: var(--token-color-icon-primary);
      --token-color-text-primary: rgba(234, 235, 238, 0.98);
      --token-color-text-secondary: rgba(234, 235, 238, 0.8);
      --token-color-text-disabled: rgba(234, 235, 238, 0.45);
      --token-color-text-sidebar-selected: var(--token-color-text-primary);
      --token-color-text-sidebar: var(--token-color-text-secondary);
      --token-color-text-label-badge: rgba(234, 235, 238, 0.85);
      --token-color-text-chip: rgb(var(--token-rgb-white));
      --token-color-background-base: rgba(25, 28, 45, 0.8);
      --token-color-background-secondary: rgba(30, 33, 54, 0.7);
      --token-color-background-sidebar: var(--sidebar-background-color);
      --token-color-background-input-base: rgba(30, 33, 54, 0.7);
      --token-color-background-input-disabled: rgba(30, 33, 54, 0.5);
      --token-color-background-label-badge: rgb(60, 60, 78);
      --token-color-background-card: var(--ha-card-glass-tint);
      --token-color-background-skrim: rgba(0, 0, 0, 0.7);
      --token-color-background-divider: rgba(84, 84, 98, 0.28);
      --token-color-background-scrollbar-thumb: rgb(68, 68, 88);
      --token-color-background-label-badge-red: var(--token-color-feedback-error);
      --token-color-background-label-badge-blue: var(--token-color-feedback-info);
      --token-color-background-label-badge-green: rgb(78, 183, 128);
      --token-color-background-label-badge-yellow: var(--token-color-feedback-warning);
      --token-color-background-label-badge-grey: rgb(83, 90, 103);
      --token-color-background-popup-scrim: rgba(0, 0, 0, 1);
